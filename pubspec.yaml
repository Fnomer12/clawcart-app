name: clawcart
description: "ClawCart - Smart shopping assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^6.2.1
  provider: ^6.1.5+1
  http: ^1.6.0
  url_launcher: ^6.3.0
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ✅ KEEP ONLY ICON GENERATOR
  flutter_launcher_icons: ^0.13.1

# ✅ APP ICON ONLY
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/splash/
    - assets/icon/